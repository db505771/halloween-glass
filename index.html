<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transparent Orange Liquid Glass</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
    }
    body {
      -webkit-tap-highlight-color: transparent;
    }
    .liquid-glass-orange {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      outline: none;
      border: none;
      border-radius: 28px;
      overflow: hidden;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      /* Much more transparent glass */
      background: linear-gradient(
        135deg,
        rgba(255, 224, 190, 0.10) 0%,
        rgba(255, 190, 145, 0.06) 45%,
        rgba(255, 155, 95, 0.09) 100%
      );
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      /* Orange edges kept exactly the same */
      box-shadow:
        inset 0 1.5px 2px rgba(255, 183, 105, 0.65),
        inset 0 -1px 2px rgba(255, 133, 55, 0.35),
        0 8px 24px rgba(255, 135, 55, 0.10);
      transition:
        transform 0.15s ease,
        background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    /* Soft orange reflection */
    .liquid-glass-orange::before {
      content: "";
      position: absolute;
      z-index: 1;
      top: 0;
      left: 4%;
      width: 92%;
      height: 42%;
      border-radius: 50%;
      background: linear-gradient(
        180deg,
        rgba(255, 190, 115, 0.22) 0%,
        rgba(255, 160, 80, 0.08) 38%,
        rgba(255, 140, 60, 0) 100%
      );
      filter: blur(9px);
      pointer-events: none;
    }
    /* Subtle orange glow at the bottom */
    .liquid-glass-orange::after {
      content: "";
      position: absolute;
      z-index: 1;
      left: 8%;
      right: 8%;
      bottom: -14%;
      height: 38%;
      border-radius: 50%;
      background: rgba(255, 145, 55, 0.08);
      filter: blur(20px);
      pointer-events: none;
    }
    /* Touch feedback */
    .liquid-glass-orange:active {
      transform: scale(0.98);
      background: linear-gradient(
        135deg,
        rgba(255, 220, 175, 0.16) 0%,
        rgba(255, 175, 105, 0.10) 50%,
        rgba(255, 145, 70, 0.12) 100%
      );
      /* Orange edges remain unchanged */
      box-shadow:
        inset 0 1.5px 2px rgba(255, 183, 105, 0.65),
        inset 0 -1px 2px rgba(255, 133, 55, 0.35),
        0 8px 24px rgba(255, 135, 55, 0.10);
    }
    @media (prefers-reduced-motion: reduce) {
      .liquid-glass-orange {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <button
    class="liquid-glass-orange"
    type="button"
    aria-label="Orange liquid glass">
  </button>
</body>
</html>
