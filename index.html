<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Soft Orange Liquid Glass</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }

    .liquid-glass-orange {
      appearance: none;
      -webkit-appearance: none;

      display: block;
      position: relative;
      isolation: isolate;

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;
      outline: none;
      border: none;

      border-radius: 28px;
      overflow: hidden;

      /* Clean clipping for iOS WebViews */
      -webkit-mask-image: -webkit-radial-gradient(white, black);

      /* Soft translucent orange tint */
      background: linear-gradient(
        135deg,
        rgba(255, 224, 190, 0.30) 0%,
        rgba(255, 190, 145, 0.22) 45%,
        rgba(255, 155, 95, 0.25) 100%
      );

      /* Frosted liquid-glass effect */
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);

      /* Delicate white highlights */
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.48),
        inset 0 -1px 2px rgba(255, 255, 255, 0.18),
        0 8px 24px rgba(0, 0, 0, 0.10);

      transition:
        transform 0.15s ease,
        background 0.15s ease;

      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    /* Soft reflection across the top */
    .liquid-glass-orange::before {
      content: "";
      position: absolute;
      z-index: 1;

      top: 0;
      left: 4%;

      width: 92%;
      height: 42%;

      border-radius: 50%;

      background: linear-gradient(
        180deg,
        rgba(255, 250, 240, 0.30) 0%,
        rgba(255, 255, 255, 0.10) 38%,
        rgba(255, 255, 255, 0) 100%
      );

      filter: blur(9px);
      pointer-events: none;
    }

    /* Very subtle warm glow near the bottom */
    .liquid-glass-orange::after {
      content: "";
      position: absolute;
      z-index: 1;

      left: 8%;
      right: 8%;
      bottom: -14%;

      height: 38%;
      border-radius: 50%;

      background: rgba(255, 165, 95, 0.12);

      filter: blur(20px);
      pointer-events: none;
    }

    /* Gentle touch feedback */
    .liquid-glass-orange:active {
      transform: scale(0.98);

      background: linear-gradient(
        135deg,
        rgba(255, 230, 205, 0.38) 0%,
        rgba(255, 190, 145, 0.28) 50%,
        rgba(255, 165, 110, 0.30) 100%
      );
    }

    @media (prefers-reduced-motion: reduce) {
      .liquid-glass-orange {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <button
    class="liquid-glass-orange"
    type="button"
    aria-label="Orange liquid glass">
  </button>
</body>
</html>
